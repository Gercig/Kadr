<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>html,body{margin:0;height:100%;background:#0A0A0D;overflow:hidden;touch-action:none}canvas{width:100%;height:100%;display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script>
// ошибки JS видны прямо на экране (для диагностики) и в журнале Android
window.onerror = function (m, src, line, col, err) {
  var key = m + '|' + line, box = document.getElementById('err');
  window.__errs = window.__errs || {};
  if (!box) {
    box = document.body.appendChild(Object.assign(document.createElement('div'), { id: 'err' }));
    box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;color:#ff8080;font:12px monospace;background:rgba(0,0,0,.8);padding:6px 8px;z-index:20;max-height:30vh;overflow:auto;white-space:pre-wrap';
    box.title = 'нажмите, чтобы скрыть';
    box.addEventListener('pointerdown', function (e) { e.stopPropagation(); box.style.display = 'none'; });
  }
  var where = src ? ' (' + String(src).split('/').pop() + ':' + line + (col ? ':' + col : '') + ')' : '';
  var stack = err && err.stack ? ' ' + String(err.stack).split('\n').slice(1, 3).join(' ← ') : '';
  if (window.__errs[key]) { window.__errs[key].n++; window.__errs[key].el.textContent = 'Ошибка ×' + window.__errs[key].n + ': ' + m + where + stack; }
  else { var d = document.createElement('div'); d.textContent = 'Ошибка: ' + m + where + stack; box.appendChild(d); window.__errs[key] = { n: 1, el: d }; }
  box.style.display = 'block';
};
</script>
<script src="screen.js"></script>
<script src="hall3d.js"></script>
<script src="vip2_screen_images.js"></script>
<script src="standard_screen_images.js"></script>
<script>
// 3D-вид из кресла. Модель зала выбирается параметром: hall3d.html#imax или hall3d.html#vip
// Android вызывает setSeat(ряд, место) и setScreen({...}); свайп поворачивает взгляд.
var cv = document.getElementById('c'), hall = null, row = 6, col = 8, yaw = 0, pitch = 0, drag = null, pending = false;
var requestedModel = location.hash.slice(1);
var model = ['imax', 'imax_compact', 'vip2'].includes(requestedModel) ? requestedModel : 'vip';
var welcomeReady = Promise.resolve();
if (model === 'vip2') welcomeReady = KadrScreen.setWelcome(vip2Welcome, vip2Background);
if (model === 'vip') welcomeReady = KadrScreen.setWelcome(standardWelcome, standardBackground);
function fit() {
  var w = cv.clientWidth || window.innerWidth || 360;
  var h = cv.clientHeight || window.innerHeight || Math.round(w * 0.54);
  var r = window.devicePixelRatio || 1;
  cv.width = Math.round(w * r); cv.height = Math.round(h * r); draw();
}
function draw() {   // не чаще кадра экрана
  if (pending) return;
  pending = true;
  requestAnimationFrame(function () { pending = false; if (hall) hall.render(row, col, yaw, pitch); });
}
function setSeat(r, c) { row = r; col = c; yaw = 0; pitch = 0; draw(); }
function setOverview() { row = 0; col = 0; yaw = 0; pitch = 0; draw(); }
function resetLook() { yaw = 0; pitch = 0; draw(); }
function setScreen(d) { KadrScreen.set(d); }
KadrScreen.onChange = draw;
cv.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', function (e) {
  if (!drag) return;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag = { x: e.clientX, y: e.clientY };
  yaw = Math.max(-2.6, Math.min(2.6, yaw - dx * 0.008));
  pitch = Math.max(-0.7, Math.min(0.8, pitch + dy * 0.008));
  draw();
});
cv.addEventListener('pointerup', function () { drag = null; });
cv.addEventListener('pointercancel', function () { drag = null; });
window.addEventListener('resize', fit);

var sc = document.createElement('script');
sc.src = 'hall_' + model + '.js';
sc.onload = function () {
  var keys = Object.keys(HALL.images || {}), imgs = {}, left = keys.length;
  async function start() {
    await welcomeReady;
    try { hall = createHall3D(cv, HALL, imgs, KadrScreen); } catch (e) { console.log('3D error: ' + e.message); window.onerror('3D: ' + e.message, 'hall3d.js', 0); hall = null; }
    if (!hall && window.Android) Android.noWebGL();
    if (window.Android && Android.ready) Android.ready();
    fit();
  }
  if (!left) start();
  keys.forEach(function (k) {
    var im = new Image();
    im.onload = im.onerror = function () { imgs[k] = im; if (--left === 0) start(); };
    im.src = HALL.images[k];
  });
};
document.body.appendChild(sc);
</script></body></html>
