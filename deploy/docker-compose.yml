# Сервер «Кадр» в Yandex Cloud: API + MySQL + Caddy (HTTPS).
# Данные MySQL лежат на отдельном диске виртуальной машины: /data/mysql
services:
  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3306:3306"
    restart: always
    environment:
      MYSQL_DATABASE: kadr
      MYSQL_USER: kadr
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - /data/mysql:/var/lib/mysql

  api:
    build: ../server
    restart: always
    environment:
      KADR_ADMIN_PASSWORD: ${KADR_ADMIN_PASSWORD:-}
      DATABASE_URL: mysql://kadr:${DB_PASSWORD}@db:3306/kadr
    depends_on:
      - db

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /data/caddy:/data
    depends_on:
      - api
